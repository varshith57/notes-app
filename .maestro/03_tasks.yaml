# Tasks: one list, three views (To-do = all, Agenda = by day, Reminders = will notify).
# Checks that a task created in any view shows up in the others it belongs to.
appId: com.varshith.mynotes
name: Tasks
---
- runFlow: subflows/fresh_launch.yaml
- tapOn: 'Tasks'
- assertVisible: 'All clear'

# To-do with validation.
- tapOn: 'Add task'
- tapOn: 'Save'
- assertVisible: 'Add a title'
- tapOn: 'OK'
- tapOn: 'What needs doing\?'
- inputText: 'Maestro todo'
- hideKeyboard
- tapOn: 'High'
- tapOn: 'Save'
- assertVisible: 'Maestro todo'

# Tick it off and back on.
- tapOn: 'Mark "Maestro todo" done'
- assertVisible: 'Mark "Maestro todo" not done'
- tapOn: 'Mark "Maestro todo" not done'

# An undated to-do is not on the agenda and doesn't remind.
- tapOn: 'Reminders'
- assertNotVisible: 'Maestro todo'

# Agenda item at a time → also in To-do and Reminders (reminder is on by default).
- tapOn: 'Agenda'
- tapOn: 'Add task'
- tapOn: 'What needs doing\?'
- inputText: 'Maestro meeting'
- hideKeyboard
- assertVisible: 'You’ll get a notification at this time.'
- tapOn: 'Save'
- runFlow: subflows/allow_exact_alarms.yaml
# Default slot is the next hour; after 11 pm that's tomorrow, so it's not on today's agenda.
- runFlow:
    when:
      true: ${new Date().getHours() < 23}
    commands:
      - assertVisible: 'Maestro meeting'
- tapOn: 'Reminders'
- assertVisible: 'Maestro meeting'
- tapOn: 'To-do'
- assertVisible: 'Maestro meeting'

# Switching the reminder off removes it from Reminders but keeps it on the agenda.
- tapOn: 'Maestro meeting'
- tapOn: 'Remind me'
- tapOn: 'Update'
- tapOn: 'Reminders'
- assertNotVisible: 'Maestro meeting'
- runFlow:
    when:
      true: ${new Date().getHours() < 23}
    commands:
      - tapOn: 'Agenda'
      - assertVisible: 'Maestro meeting'

# Bulk delete from the To-do view removes them everywhere.
- tapOn: 'To-do'
- longPressOn: 'Maestro todo'
- tapOn: 'Maestro meeting'
- tapOn: 'Delete 2 selected'
- tapOn: 'Delete'
- assertVisible: 'All clear'
- tapOn: 'Agenda'
- assertNotVisible: 'Maestro meeting'
