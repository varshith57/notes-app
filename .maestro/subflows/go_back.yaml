# The phone's own "back": Android back button/gesture, iOS edge swipe.
appId: com.varshith.mynotes
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 400
