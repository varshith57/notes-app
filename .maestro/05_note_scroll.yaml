# Long notes: the page scrolls up and down even when the swipe starts on the text, and a
# reopened note scrolls too. The body is one text box, so scrolling is checked by whether
# the title (above it) is on screen; screenshots record the rest.
appId: com.varshith.mynotes
name: Long note scrolling
---
- runFlow: subflows/fresh_launch.yaml
- tapOn: 'Notes'
- tapOn: 'New note'
- tapOn: 'Title'
- inputText: 'Scroll test'
- tapOn: 'Start writing…'

# 25 lines: taller than the screen.
- evalScript: ${output.line = 0}
- repeat:
    times: 25
    commands:
      - evalScript: ${output.line = output.line + 1}
      - inputText: 'Line ${output.line} of a long note'
      - pressKey: Enter

# While typing, the newest line stays above the keyboard (title scrolled away).
- assertNotVisible: 'Scroll test'
- takeScreenshot: note_typing_bottom
- hideKeyboard

# Swipe down (starting on the text) back to the top.
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 85%
          duration: 500
- assertVisible: 'Scroll test'
- takeScreenshot: note_top

# And up to the end again.
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 500
- assertNotVisible: 'Scroll test'
- takeScreenshot: note_bottom

# Reopened from the list, the note still scrolls.
- runFlow: subflows/go_back.yaml
- assertVisible: 'Scroll test'
- tapOn: 'Scroll test'
- assertVisible: 'Scroll test'
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 500
- assertNotVisible: 'Scroll test'
- runFlow: subflows/go_back.yaml
