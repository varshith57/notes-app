# Builds the app for an iOS simulator and runs the Maestro flows in .maestro/
# on EAS's cloud devices. Run manually: npx eas-cli@latest workflow:run .eas/workflows/e2e-ios.yml
name: e2e-ios

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_test:
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/01_notes.yaml
        - .maestro/02_finance.yaml
        - .maestro/03_tasks.yaml
        - .maestro/04_navigation.yaml
        - .maestro/05_note_scroll.yaml
        - .maestro/06_budgets.yaml
